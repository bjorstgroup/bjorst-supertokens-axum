[package]
name = "bjorst-supertokens-axum"
version = "0.2.0"
edition = "2021"
authors = ["Bjorst Engineering <engineering@bjorst.com>"]
license = "MIT"
description = "SuperTokens for Axum: session verification, a client for the core, and session cookies"

[dependencies]
axum        = { version = "0.8", default-features = false, features = ["json"] }
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
uuid        = { version = "1", features = ["serde"] }
sha2        = "0.10"
moka        = { version = "0.12", features = ["future"] }
thiserror   = "2"
tracing     = "0.1"
metrics     = "0.24"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
